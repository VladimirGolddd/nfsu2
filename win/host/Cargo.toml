[package]
name = "nfsu2"
version = "0.1.0"
edition = "2021"
description = "Need for Speed: Underground 2 for Windows: the native host of the recompiled game (win/README.md)"
license = "MIT"
publish = false

[[bin]]
name = "nfsu2"
path = "src/main.rs"

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl", "std"] }
winit = "=0.30.13"
cpal = "=0.18.2"
pollster = "0.4"
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_XboxController", "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging", "Win32_System_Environment", "Win32_UI_Shell", "Win32_System_Com",
  "Win32_UI_Shell_Common", "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
debug = 1
panic = "abort"
